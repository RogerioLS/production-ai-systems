name: CI Quality Gate

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make install

      - name: Code Quality (Black, Isort, Ruff)
        run: |
          make check

      - name: Cache tiktoken encodings
        uses: actions/cache@v4
        with:
          path: ~/.cache/tiktoken
          key: tiktoken-encodings-v1

      - name: Warm up tiktoken encodings
        env:
          TIKTOKEN_CACHE_DIR: ~/.cache/tiktoken
        run: |
          python -c "import requests, tiktoken; requests.packages.urllib3.disable_warnings(); requests.get = lambda url, **kw: requests.Session().get(url, verify=False, **kw); tiktoken.get_encoding('cl100k_base')" || true

      - name: Run Tests
        env:
          TIKTOKEN_CACHE_DIR: ~/.cache/tiktoken
        run: |
          make test
