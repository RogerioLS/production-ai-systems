site_name: Production AI Systems
site_description: Advanced roadmap for building production-grade AI systems
site_author: Rogerio Silva

theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mermaid2
  - mkdocstrings:
      handlers:
        python:
          paths: ["source"]
          options:
            show_source: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - md_in_html
  - attr_list

nav:
  - Início: index.md
  - Roadmap: roadmap.md
  - Foundations:
    - Overview: notes/01_foundations.md
  - Architecture:
    - Overview: architecture/overview.md
    - ADRs:
      - Index: adr/index.md
      - "0001: Initial Structure": adr/0001-initial-structure.md
  - Progress: PROGRESS.md
